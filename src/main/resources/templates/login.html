<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Login - Travel With</title>
    <link rel="stylesheet" th:href="@{/style.css}"/>
</head>
<body>
<div class="container auth-container">
    <h1>Travel With</h1>
    <p class="subtitle">Login with your phone number and password.</p>

    <div class="alert info" th:if="${param.registered}">
        Account created successfully. Please login.
    </div>
    <div class="alert info" th:if="${param.logout}">
        You have been logged out.
    </div>
    <div class="alert error" th:if="${param.error}">
        Invalid phone number or password.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="form-group">
            <label for="username">Phone Number</label>
            <input id="username" name="username" type="tel"
                   inputmode="numeric" minlength="10" maxlength="10"
                   placeholder="10-digit phone number" required />
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required />
        </div>


        <button class="btn-submit" type="submit">Login</button>
    </form>

    <div class="links-row">
        New user? <a th:href="@{/register}">Create an account</a>
    </div>
</div>
</body>
</html>
