spring.application.name=TravelWith

# Default local dev database. Use the mysql profile for a local or hosted MySQL database.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:travelWith;MODE=MySQL;DATABASE_TO_UPPER=false;NON_KEYWORDS=USER}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}


spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}


spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.jpa.show-sql=true

spring.h2.console.enabled=true

# Bind to Render's PORT env var in production, default 8080 locally
server.port=${PORT:8080}

seed.stations.enabled=false

app.jwt.secret=${JWT_SECRET:VGhpc0lzTG9jYWxEZXZlbG9wbWVudE9ubHlKd3RTZWNyZXRLZXk=}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
