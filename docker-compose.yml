services:
  mysql:
    image: mysql:8.4
    container_name: travelwith-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: travelWith
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    ports:
      - "3306:3306"
    volumes:
      - travelwith-mysql-data:/var/lib/mysql

volumes:
  travelwith-mysql-data:
